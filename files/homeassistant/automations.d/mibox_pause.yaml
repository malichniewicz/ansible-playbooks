alias: "MiBox pause"
id: mibox_pause_leds_red
trigger:
  - platform: state
    entity_id: media_player.xiaomi_tv_box
    from: "playing"
    to: "paused"
    for:
      seconds: 2
condition:
  - condition: template
    value_template: >
      {{ state_attr('remote.mitv_afmu0', 'current_activity') != 'com.google.android.apps.tv.launcherx' }}
action:
  - service: light.turn_on
    target:
      entity_id: light.0xa4c1380207157e9a
    data:
      rgb_color: [255, 0, 0]
      brightness: 128   # 50%
      transition: 2   # soft transition to red
mode: single
