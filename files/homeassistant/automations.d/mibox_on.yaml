alias: "MiBox ON"
id: mibox_turns_on_projector_and_leds
trigger:
  - platform: state
    entity_id: remote.mitv_afmu0
    to: "on"
  - platform: state
    entity_id: remote.mitv_afmu0
    from: "unavailable"
    to: "idle"
  - platform: state
    entity_id: remote.mitv_afmu0
    from: "off"
    to: "on"
action:
  - service: switch.turn_on
    target:
      entity_id: switch.0xa4c1383d537c5120   # fingerbot

  - service: light.turn_on
    target:
      entity_id: light.0xa4c1380207157e9a   # LED RGB
    data:
      rgb_color: [255, 190, 120]
      brightness: 220
mode: single
