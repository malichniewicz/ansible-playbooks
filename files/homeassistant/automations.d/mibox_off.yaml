alias: "MiBox OFF"
id: mibox_turns_off_projector
trigger:
  - platform: state
    entity_id: remote.mitv_afmu0
    from: "on"
    to: "off"
action:
  - service: switch.turn_off
    target:
      entity_id: switch.0xa4c1383d537c5120
  - service: light.turn_off
    target:
      entity_id: light.0xa4c1380207157e9a
mode: single
